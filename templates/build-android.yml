# Builds a signed Android App Bundle and uploads it to a Google Play track.
# Copy to .github/workflows/ in your Expo app.
# Secrets:
#   ANDROID_UPLOAD_KEYSTORE_BASE64  the upload keystore, base64. If EAS holds it, download it with `eas credentials`.
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   PLAY_SERVICE_ACCOUNT_JSON       a Google Play service account with release rights
# Variables: ANDROID_PACKAGE_NAME
name: Build Android
on:
  workflow_dispatch:
    inputs:
      track:
        description: Play track
        default: internal
        type: choice
        options: [internal, alpha, beta, production]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: bun install --frozen-lockfile
      - run: npx expo prebuild --platform android --clean
      - name: Write the upload keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
      - name: Build the bundle
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          ./gradlew app:bundleRelease
          -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks"
          -Pandroid.injected.signing.store.password="$STORE_PASSWORD"
          -Pandroid.injected.signing.key.alias="$KEY_ALIAS"
          -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ vars.ANDROID_PACKAGE_NAME }}
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.track == 'production' && 'draft' || 'completed' }}
